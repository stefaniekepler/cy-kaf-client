name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: "1.26"}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - run: go test ./... -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./internal/...
      - run: bash scripts/coverage-gate.sh coverage.out
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - run: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec jest --ci
      - run: pnpm build
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: "1.26"}
      - run: make gen-go && git diff --exit-code -- internal/api/generated/
  build-matrix:
    needs: [backend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: "1.26"}
      - run: |
          ext=""; [ "${{ matrix.goos }}" = windows ] && ext=".exe"
          mkdir -p webui/static && touch webui/static/.gitkeep
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -o dist/cy-kaf-client-${{ matrix.goos }}-${{ matrix.goarch }}$ext ./cmd/cy-kaf-client
      - uses: actions/upload-artifact@v4
        with:
          name: cy-kaf-client-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
  desktop-package:
    needs: [backend, frontend]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            smoke: macos
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            smoke: macos
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            smoke: windows
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: ${{ matrix.target }}
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - run: make build-fe
      - name: Build target sidecar
        shell: bash
        run: |
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go run ./scripts/build-desktop-sidecar \
            -target "${{ matrix.target }}" \
            -output-dir desktop/src-tauri/binaries \
            -version "0.1.0-${GITHUB_RUN_NUMBER}" \
            -commit "${GITHUB_SHA}" \
            -build-time "${build_time}"
      - name: Build native packages
        working-directory: desktop
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Smoke macOS desktop executable
        if: matrix.smoke == 'macos'
        shell: bash
        run: >-
          bash scripts/desktop-smoke.sh
          desktop/src-tauri/target/${{ matrix.target }}/release/cy-kaf-client-desktop
      - name: Smoke Windows NSIS installation
        if: matrix.smoke == 'windows'
        shell: pwsh
        run: |
          $Installers = @(
            Get-ChildItem `
              "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe"
          )
          if ($Installers.Count -ne 1) {
            throw "expected exactly one NSIS installer"
          }
          $InstallDir = Join-Path $env:RUNNER_TEMP "cy-kaf-client-smoke"
          & ./scripts/desktop-smoke.ps1 `
            -Installer $Installers[0].FullName `
            -InstallDir $InstallDir
      - name: Upload macOS packages
        if: matrix.smoke == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: cy-kaf-client-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Upload Windows package
        if: matrix.smoke == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: cy-kaf-client-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
# 说明：CI 的 build-matrix 用空 webui/static 出"无前端"工件做编译门禁；
# 含前端的完整产物由本地/发布流程的 `make release-build` 产出（CD defer，规格 §1.3）。
# integration 与 e2e（make test-integration / make e2e-p1a）需本机 Docker/colima，
# 刻意不进 CI；desktop-package 只用空 Kafka 配置验证三平台原生包与进程生命周期，
# 不启动或查询 Kafka。
