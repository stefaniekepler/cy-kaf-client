name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      github.event_name == 'workflow_dispatch' &&
      format('release-{0}', inputs.release_tag) ||
      startsWith(github.ref, 'refs/tags/') &&
      format('release-{0}', github.ref_name) ||
      github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name != 'workflow_dispatch' &&
      !startsWith(github.ref, 'refs/tags/')
    }}

env:
  BUILD_REF: >-
    ${{
      github.event_name == 'workflow_dispatch' &&
      format('refs/tags/{0}', inputs.release_tag) ||
      github.ref
    }}
  RELEASE_TAG: >-
    ${{
      github.event_name == 'workflow_dispatch' && inputs.release_tag ||
      startsWith(github.ref, 'refs/tags/') && github.ref_name || ''
    }}

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      is_release: ${{ steps.metadata.outputs.is_release }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - id: metadata
        name: Validate release metadata
        shell: bash
        run: |
          go run ./scripts/releasemeta \
            -tag "${RELEASE_TAG}" \
            -tauri-config desktop/src-tauri/tauri.conf.json \
            -cargo-toml desktop/src-tauri/Cargo.toml \
            -github-output "${GITHUB_OUTPUT}"
      - id: source
        name: Resolve immutable source commit
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  backend:
    needs: [version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-check.outputs.commit }}
      - uses: actions/setup-go@v6
        with: {go-version: "1.26"}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - run: go test ./... -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./internal/...
      - run: bash scripts/coverage-gate.sh coverage.out

  frontend:
    needs: [version-check]
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-check.outputs.commit }}
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - run: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec jest --ci
      - run: pnpm build

  contract-check:
    needs: [version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-check.outputs.commit }}
      - uses: actions/setup-go@v6
        with: {go-version: "1.26"}
      - run: make gen-go && git diff --exit-code -- internal/api/generated/

  build-matrix:
    needs: [version-check, backend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-check.outputs.commit }}
      - uses: actions/setup-go@v6
        with: {go-version: "1.26"}
      - run: |
          ext=""; [ "${{ matrix.goos }}" = windows ] && ext=".exe"
          mkdir -p webui/static && touch webui/static/.gitkeep
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -o dist/cy-kaf-client-${{ matrix.goos }}-${{ matrix.goarch }}$ext ./cmd/cy-kaf-client
      - uses: actions/upload-artifact@v4
        with:
          name: cy-kaf-client-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  desktop-package:
    needs: [version-check, backend, frontend]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            smoke: macos
            macos_min: "13.0"
            asset: macos-x86_64
            file_arch: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            smoke: macos
            macos_min: "12.0"
            asset: macos-aarch64
            file_arch: ""
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            smoke: windows
            macos_min: ""
            asset: windows-x86_64
            file_arch: ""
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            smoke: windows
            macos_min: ""
            asset: windows-aarch64
            file_arch: ""
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
            smoke: linux
            macos_min: ""
            asset: linux-x86_64
            file_arch: x86-64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage
            smoke: linux
            macos_min: ""
            asset: linux-aarch64
            file_arch: ARM aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-check.outputs.commit }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - name: Install Linux desktop dependencies
        if: matrix.smoke == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            lsof \
            openbox \
            patchelf \
            wget \
            x11-utils \
            xdotool \
            xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: ${{ matrix.target }}
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - run: make build-fe
      - name: Build target sidecar
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
        run: |
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit="$(git rev-parse HEAD)"
          go run ./scripts/build-desktop-sidecar \
            -target "${{ matrix.target }}" \
            -output-dir desktop/src-tauri/binaries \
            -version "${{ needs.version-check.outputs.version }}" \
            -commit "${commit}" \
            -build-time "${build_time}"
      - name: Build macOS native package
        if: matrix.smoke == 'macos' && needs.version-check.outputs.is_release != 'true'
        working-directory: desktop
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
        run: |
          cargo tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --config '{"bundle":{"macOS":{"minimumSystemVersion":"${{ matrix.macos_min }}"}}}'
      - name: Build signed macOS native package and updater artifact
        if: matrix.smoke == 'macos' && needs.version-check.outputs.is_release == 'true'
        working-directory: desktop
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "${TAURI_SIGNING_PRIVATE_KEY}"
          cargo tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --config '{"bundle":{"createUpdaterArtifacts":true,"macOS":{"minimumSystemVersion":"${{ matrix.macos_min }}"}}}'
      - name: Build Windows native package
        if: matrix.smoke == 'windows' && needs.version-check.outputs.is_release != 'true'
        working-directory: desktop
        shell: pwsh
        run: >-
          cargo tauri build
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
      - name: Build signed Windows native package and updater artifact
        if: matrix.smoke == 'windows' && needs.version-check.outputs.is_release == 'true'
        working-directory: desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required for release builds"
          }
          cargo tauri build `
            --target "${{ matrix.target }}" `
            --bundles "${{ matrix.bundles }}" `
            --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Build Linux native package
        if: matrix.smoke == 'linux' && needs.version-check.outputs.is_release != 'true'
        working-directory: desktop
        shell: bash
        run: >-
          cargo tauri build
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
      - name: Build signed Linux native package and updater artifact
        if: matrix.smoke == 'linux' && needs.version-check.outputs.is_release == 'true'
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "${TAURI_SIGNING_PRIVATE_KEY}"
          cargo tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Smoke macOS desktop executable
        if: matrix.smoke == 'macos'
        shell: bash
        run: >-
          bash scripts/desktop-smoke.sh
          desktop/src-tauri/target/${{ matrix.target }}/release/cy-kaf-client-desktop
      - name: Smoke Windows NSIS installation
        if: matrix.smoke == 'windows'
        shell: pwsh
        run: |
          $Installers = @(
            Get-ChildItem `
              "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe"
          )
          if ($Installers.Count -ne 1) {
            throw "expected exactly one NSIS installer"
          }
          $InstallDir = Join-Path ([System.IO.Path]::GetTempPath()) ("cy-kaf-client-smoke-" + [System.Guid]::NewGuid())
          & ./scripts/desktop-smoke.ps1 `
            -Installer $Installers[0].FullName `
            -InstallDir $InstallDir
      - name: Smoke Linux AppImage
        if: matrix.smoke == 'linux'
        shell: bash
        run: |
          appimage_dir="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage"
          appimage_count="$(find "${appimage_dir}" -maxdepth 1 -type f -name '*.AppImage' | wc -l | tr -d ' ')"
          if [ "${appimage_count}" -ne 1 ]; then
            echo "expected exactly one AppImage, found ${appimage_count}" >&2
            exit 1
          fi
          appimage="$(find "${appimage_dir}" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          chmod +x "${appimage}"
          appimage_type="$(file -b "${appimage}")"
          if [[ "${appimage_type}" != *"${{ matrix.file_arch }}"* ]]; then
            echo "AppImage architecture mismatch: ${appimage_type}" >&2
            exit 1
          fi
          xvfb-run -a bash scripts/desktop-smoke-linux.sh "${appimage}"
      - name: Normalize macOS release asset
        if: matrix.smoke == 'macos'
        shell: bash
        run: |
          installer_dir="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          installer_count="$(find "${installer_dir}" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [ "${installer_count}" -ne 1 ]; then
            echo "expected exactly one DMG installer, found ${installer_count}" >&2
            exit 1
          fi
          installer="$(find "${installer_dir}" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          mkdir -p release-assets
          cp "${installer}" \
            "release-assets/Cy-KafClient_${{ needs.version-check.outputs.version }}_${{ matrix.asset }}.dmg"
      - name: Normalize signed macOS updater artifact
        if: matrix.smoke == 'macos' && needs.version-check.outputs.is_release == 'true'
        shell: bash
        run: |
          updater_dir="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          updater_count="$(find "${updater_dir}" -maxdepth 1 -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')"
          if [ "${updater_count}" -ne 1 ]; then
            echo "expected exactly one macOS updater artifact, found ${updater_count}" >&2
            exit 1
          fi
          updater="$(find "${updater_dir}" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          test -s "${updater}.sig"
          updater_name="Cy-KafClient_${{ needs.version-check.outputs.version }}_${{ matrix.asset }}.app.tar.gz"
          cp "${updater}" "release-assets/${updater_name}"
          cp "${updater}.sig" "release-assets/${updater_name}.sig"
      - name: Normalize Windows release asset
        if: matrix.smoke == 'windows'
        shell: pwsh
        run: |
          $Installers = @(
            Get-ChildItem `
              "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe"
          )
          if ($Installers.Count -ne 1) {
            throw "expected exactly one NSIS installer"
          }
          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          Copy-Item `
            $Installers[0].FullName `
            "release-assets/Cy-KafClient_${{ needs.version-check.outputs.version }}_${{ matrix.asset }}-setup.exe"
          if ('${{ needs.version-check.outputs.is_release }}' -eq 'true') {
            $Signature = $Installers[0].FullName + '.sig'
            if (!(Test-Path $Signature) -or (Get-Item $Signature).Length -eq 0) {
              throw "missing or empty updater signature for $($Installers[0].Name)"
            }
            Copy-Item `
              $Signature `
              "release-assets/Cy-KafClient_${{ needs.version-check.outputs.version }}_${{ matrix.asset }}-setup.exe.sig"
          }
      - name: Normalize Linux release asset
        if: matrix.smoke == 'linux'
        shell: bash
        run: |
          appimage_dir="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage"
          appimage_count="$(find "${appimage_dir}" -maxdepth 1 -type f -name '*.AppImage' | wc -l | tr -d ' ')"
          if [ "${appimage_count}" -ne 1 ]; then
            echo "expected exactly one AppImage, found ${appimage_count}" >&2
            exit 1
          fi
          appimage="$(find "${appimage_dir}" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          mkdir -p release-assets
          cp "${appimage}" \
            "release-assets/Cy-KafClient_${{ needs.version-check.outputs.version }}_${{ matrix.asset }}.AppImage"
          if [ "${{ needs.version-check.outputs.is_release }}" = true ]; then
            test -s "${appimage}.sig"
            cp "${appimage}.sig" \
              "release-assets/Cy-KafClient_${{ needs.version-check.outputs.version }}_${{ matrix.asset }}.AppImage.sig"
          fi
      - name: Upload normalized release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error

  release:
    if: >-
      ${{
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        needs.version-check.outputs.is_release == 'true'
      }}
    needs:
      - version-check
      - backend
      - frontend
      - contract-check
      - desktop-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
      SOURCE_COMMIT: ${{ needs.version-check.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.version-check.outputs.tag }}
          fetch-depth: 1
      - name: Verify release tag still identifies source commit
        shell: bash
        run: |
          tag_commit="$(git rev-parse HEAD)"
          if [ "${tag_commit}" != "${SOURCE_COMMIT}" ]; then
            echo "release tag moved from ${SOURCE_COMMIT} to ${tag_commit}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Verify signed updater artifacts and create manifest
        shell: bash
        run: |
          go run ./scripts/updaterverify \
            -dir release-assets \
            -version "${RELEASE_VERSION}" \
            -tauri-config desktop/src-tauri/tauri.conf.json
          release_notes="$(git log -1 --pretty=%s)"
          publication_date="$(git show -s --format=%cI HEAD)"
          go run ./scripts/updatermanifest \
            -dir release-assets \
            -version "${RELEASE_VERSION}" \
            -tag "${RELEASE_TAG}" \
            -notes "${release_notes}" \
            -pub-date "${publication_date}" \
            -output release-assets/latest.json
      - name: Verify release assets and create checksums
        shell: bash
        run: |
          expected=(
            "Cy-KafClient_${RELEASE_VERSION}_macos-x86_64.dmg"
            "Cy-KafClient_${RELEASE_VERSION}_macos-aarch64.dmg"
            "Cy-KafClient_${RELEASE_VERSION}_macos-x86_64.app.tar.gz"
            "Cy-KafClient_${RELEASE_VERSION}_macos-x86_64.app.tar.gz.sig"
            "Cy-KafClient_${RELEASE_VERSION}_macos-aarch64.app.tar.gz"
            "Cy-KafClient_${RELEASE_VERSION}_macos-aarch64.app.tar.gz.sig"
            "Cy-KafClient_${RELEASE_VERSION}_windows-x86_64-setup.exe"
            "Cy-KafClient_${RELEASE_VERSION}_windows-x86_64-setup.exe.sig"
            "Cy-KafClient_${RELEASE_VERSION}_windows-aarch64-setup.exe"
            "Cy-KafClient_${RELEASE_VERSION}_windows-aarch64-setup.exe.sig"
            "Cy-KafClient_${RELEASE_VERSION}_linux-x86_64.AppImage"
            "Cy-KafClient_${RELEASE_VERSION}_linux-x86_64.AppImage.sig"
            "Cy-KafClient_${RELEASE_VERSION}_linux-aarch64.AppImage"
            "Cy-KafClient_${RELEASE_VERSION}_linux-aarch64.AppImage.sig"
            "latest.json"
          )
          actual_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "${actual_count}" -ne "${#expected[@]}" ]; then
            echo "expected ${#expected[@]} release assets, found ${actual_count}" >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi
          for package in "${expected[@]}"; do
            if [ ! -f "release-assets/${package}" ]; then
              echo "missing release asset: ${package}" >&2
              exit 1
            fi
          done
          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
      - name: Publish GitHub Release
        shell: bash
        run: |
          notes_file="${RUNNER_TEMP}/cy-kaf-client-release-notes.md"
          cat > "${notes_file}" <<'EOF'
          <!-- cy-kaf-client-release-notice:start -->
          Desktop updates:
          - Background checks and rate-limited downloads keep the current window and operations running. Update status appears only in Settings.
          - Install after explicit confirmation and restart, or schedule installation for the next launch. Ordinary window close does not install updates.
          - Updater packages are signature-verified. Installation is deferred while another process is using the application.
          - Versions 0.1.2 and earlier require one manual installation of this first updater-enabled release.

          Packages do not have Apple/Windows operating-system code signing. macOS may require an explicit Gatekeeper approval, and Windows may show a SmartScreen warning. Updater signatures verify update packages but do not remove those OS prompts. Verify downloads with SHA256SUMS.txt before installation.

          Compatibility:
          - macOS Intel: macOS 13 or later
          - macOS Apple Silicon: macOS 12 or later
          - Windows x64: Windows 10 or 11
          - Windows ARM64: Windows 11 on ARM
          - Linux x86_64: 64-bit x86 Linux (Ubuntu 24.04 build baseline)
          - Linux ARM64: 64-bit ARM Linux (Ubuntu 24.04 build baseline)

          Linux AppImages may require `chmod +x` and FUSE 2. When FUSE is unavailable, set `APPIMAGE_EXTRACT_AND_RUN=1`. A compatible graphical session and WebKitGTK runtime are required.
          <!-- cy-kaf-client-release-notice:end -->
          EOF
          go run ./scripts/releasepublish \
            -tag "${RELEASE_TAG}" \
            -assets-dir release-assets \
            -title "Cy-KafClient ${RELEASE_TAG}" \
            -notes-file "${notes_file}"

# 说明：CI 的 build-matrix 用空 webui/static 出"无前端"工件做编译门禁；
# 含前端的完整产物由 desktop-package 在原生 runner 上构建。
# integration 与 e2e（make test-integration / make e2e-p1a）需本机 Docker/colima，
# 刻意不进 CI；desktop-package 只用空 Kafka 配置验证六个平台/架构组合的原生包与进程生命周期，
# 不启动或查询 Kafka。
