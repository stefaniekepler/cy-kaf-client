name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      github.event_name == 'workflow_dispatch' &&
      format('release-{0}', inputs.release_tag) ||
      startsWith(github.ref, 'refs/tags/') &&
      format('release-{0}', github.ref_name) ||
      github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name != 'workflow_dispatch' &&
      !startsWith(github.ref, 'refs/tags/')
    }}

env:
  BUILD_REF: >-
    ${{
      github.event_name == 'workflow_dispatch' &&
      format('refs/tags/{0}', inputs.release_tag) ||
      github.ref
    }}
  RELEASE_TAG: >-
    ${{
      github.event_name == 'workflow_dispatch' && inputs.release_tag ||
      startsWith(github.ref, 'refs/tags/') && github.ref_name || ''
    }}

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      is_release: ${{ steps.metadata.outputs.is_release }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - id: metadata
        name: Validate release metadata
        shell: bash
        run: |
          go run ./scripts/releasemeta \
            -tag "${RELEASE_TAG}" \
            -tauri-config desktop/src-tauri/tauri.conf.json \
            -cargo-toml desktop/src-tauri/Cargo.toml \
            -github-output "${GITHUB_OUTPUT}"
      - id: source
        name: Resolve immutable source commit
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  backend:
    needs: [version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-check.outputs.commit }}
      - uses: actions/setup-go@v6
        with: {go-version: "1.26"}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - run: go test ./... -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./internal/...
      - run: bash scripts/coverage-gate.sh coverage.out

  frontend:
    needs: [version-check]
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-check.outputs.commit }}
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - run: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec jest --ci
      - run: pnpm build

  contract-check:
    needs: [version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-check.outputs.commit }}
      - uses: actions/setup-go@v6
        with: {go-version: "1.26"}
      - run: make gen-go && git diff --exit-code -- internal/api/generated/

  build-matrix:
    needs: [version-check, backend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-check.outputs.commit }}
      - uses: actions/setup-go@v6
        with: {go-version: "1.26"}
      - run: |
          ext=""; [ "${{ matrix.goos }}" = windows ] && ext=".exe"
          mkdir -p webui/static && touch webui/static/.gitkeep
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -o dist/cy-kaf-client-${{ matrix.goos }}-${{ matrix.goarch }}$ext ./cmd/cy-kaf-client
      - uses: actions/upload-artifact@v4
        with:
          name: cy-kaf-client-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  desktop-package:
    needs: [version-check, backend, frontend]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            smoke: macos
            macos_min: "13.0"
            asset: macos-x86_64
            file_arch: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            smoke: macos
            macos_min: "12.0"
            asset: macos-aarch64
            file_arch: ""
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            smoke: windows
            macos_min: ""
            asset: windows-x86_64
            file_arch: ""
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            smoke: windows
            macos_min: ""
            asset: windows-aarch64
            file_arch: ""
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
            smoke: linux
            macos_min: ""
            asset: linux-x86_64
            file_arch: x86-64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage
            smoke: linux
            macos_min: ""
            asset: linux-aarch64
            file_arch: ARM aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-check.outputs.commit }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - name: Install Linux desktop dependencies
        if: matrix.smoke == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            lsof \
            openbox \
            patchelf \
            wget \
            x11-utils \
            xdotool \
            xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: ${{ matrix.target }}
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - run: make build-fe
      - name: Build target sidecar
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
        run: |
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit="$(git rev-parse HEAD)"
          go run ./scripts/build-desktop-sidecar \
            -target "${{ matrix.target }}" \
            -output-dir desktop/src-tauri/binaries \
            -version "${{ needs.version-check.outputs.version }}" \
            -commit "${commit}" \
            -build-time "${build_time}"
      - name: Build macOS native package
        if: matrix.smoke == 'macos'
        working-directory: desktop
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
        run: |
          cargo tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --config '{"bundle":{"macOS":{"minimumSystemVersion":"${{ matrix.macos_min }}"}}}'
      - name: Build Windows native package
        if: matrix.smoke == 'windows'
        working-directory: desktop
        shell: pwsh
        run: >-
          cargo tauri build
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
      - name: Build Linux native package
        if: matrix.smoke == 'linux'
        working-directory: desktop
        shell: bash
        run: >-
          cargo tauri build
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
      - name: Smoke macOS desktop executable
        if: matrix.smoke == 'macos'
        shell: bash
        run: >-
          bash scripts/desktop-smoke.sh
          desktop/src-tauri/target/${{ matrix.target }}/release/cy-kaf-client-desktop
      - name: Smoke Windows NSIS installation
        if: matrix.smoke == 'windows'
        shell: pwsh
        run: |
          $Installers = @(
            Get-ChildItem `
              "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe"
          )
          if ($Installers.Count -ne 1) {
            throw "expected exactly one NSIS installer"
          }
          $InstallDir = Join-Path ([System.IO.Path]::GetTempPath()) ("cy-kaf-client-smoke-" + [System.Guid]::NewGuid())
          & ./scripts/desktop-smoke.ps1 `
            -Installer $Installers[0].FullName `
            -InstallDir $InstallDir
      - name: Smoke Linux AppImage
        if: matrix.smoke == 'linux'
        shell: bash
        run: |
          appimage_dir="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage"
          appimage_count="$(find "${appimage_dir}" -maxdepth 1 -type f -name '*.AppImage' | wc -l | tr -d ' ')"
          if [ "${appimage_count}" -ne 1 ]; then
            echo "expected exactly one AppImage, found ${appimage_count}" >&2
            exit 1
          fi
          appimage="$(find "${appimage_dir}" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          chmod +x "${appimage}"
          appimage_type="$(file -b "${appimage}")"
          if [[ "${appimage_type}" != *"${{ matrix.file_arch }}"* ]]; then
            echo "AppImage architecture mismatch: ${appimage_type}" >&2
            exit 1
          fi
          xvfb-run -a bash scripts/desktop-smoke-linux.sh "${appimage}"
      - name: Normalize macOS release asset
        if: matrix.smoke == 'macos'
        shell: bash
        run: |
          installer_dir="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          installer_count="$(find "${installer_dir}" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [ "${installer_count}" -ne 1 ]; then
            echo "expected exactly one DMG installer, found ${installer_count}" >&2
            exit 1
          fi
          installer="$(find "${installer_dir}" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          mkdir -p release-assets
          cp "${installer}" \
            "release-assets/Cy-KafClient_${{ needs.version-check.outputs.version }}_${{ matrix.asset }}.dmg"
      - name: Normalize Windows release asset
        if: matrix.smoke == 'windows'
        shell: pwsh
        run: |
          $Installers = @(
            Get-ChildItem `
              "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe"
          )
          if ($Installers.Count -ne 1) {
            throw "expected exactly one NSIS installer"
          }
          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          Copy-Item `
            $Installers[0].FullName `
            "release-assets/Cy-KafClient_${{ needs.version-check.outputs.version }}_${{ matrix.asset }}-setup.exe"
      - name: Normalize Linux release asset
        if: matrix.smoke == 'linux'
        shell: bash
        run: |
          appimage_dir="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage"
          appimage_count="$(find "${appimage_dir}" -maxdepth 1 -type f -name '*.AppImage' | wc -l | tr -d ' ')"
          if [ "${appimage_count}" -ne 1 ]; then
            echo "expected exactly one AppImage, found ${appimage_count}" >&2
            exit 1
          fi
          appimage="$(find "${appimage_dir}" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          mkdir -p release-assets
          cp "${appimage}" \
            "release-assets/Cy-KafClient_${{ needs.version-check.outputs.version }}_${{ matrix.asset }}.AppImage"
      - name: Upload normalized release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error

  release:
    if: >-
      ${{
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        needs.version-check.outputs.is_release == 'true'
      }}
    needs:
      - version-check
      - backend
      - frontend
      - contract-check
      - desktop-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
      SOURCE_COMMIT: ${{ needs.version-check.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.version-check.outputs.tag }}
          fetch-depth: 1
      - name: Verify release tag still identifies source commit
        shell: bash
        run: |
          tag_commit="$(git rev-parse HEAD)"
          if [ "${tag_commit}" != "${SOURCE_COMMIT}" ]; then
            echo "release tag moved from ${SOURCE_COMMIT} to ${tag_commit}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release assets and create checksums
        shell: bash
        run: |
          expected=(
            "Cy-KafClient_${RELEASE_VERSION}_macos-x86_64.dmg"
            "Cy-KafClient_${RELEASE_VERSION}_macos-aarch64.dmg"
            "Cy-KafClient_${RELEASE_VERSION}_windows-x86_64-setup.exe"
            "Cy-KafClient_${RELEASE_VERSION}_windows-aarch64-setup.exe"
            "Cy-KafClient_${RELEASE_VERSION}_linux-x86_64.AppImage"
            "Cy-KafClient_${RELEASE_VERSION}_linux-aarch64.AppImage"
          )
          actual_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "${actual_count}" -ne "${#expected[@]}" ]; then
            echo "expected ${#expected[@]} release assets, found ${actual_count}" >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi
          for package in "${expected[@]}"; do
            if [ ! -f "release-assets/${package}" ]; then
              echo "missing release asset: ${package}" >&2
              exit 1
            fi
          done
          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
      - name: Publish GitHub Release
        shell: bash
        run: |
          notice_end='<!-- cy-kaf-client-release-notice:end -->'
          notice=$'<!-- cy-kaf-client-release-notice:start -->\nThese packages are unsigned. macOS may require an explicit Gatekeeper approval, and Windows may show a SmartScreen warning. Verify downloads with SHA256SUMS.txt before installation.\n\nCompatibility:\n- macOS Intel: macOS 13 or later\n- macOS Apple Silicon: macOS 12 or later\n- Windows x64: Windows 10 or 11\n- Windows ARM64: Windows 11 on ARM\n- Linux x86_64: 64-bit x86 Linux (Ubuntu 24.04 build baseline)\n- Linux ARM64: 64-bit ARM Linux (Ubuntu 24.04 build baseline)\n\nLinux AppImages may require `chmod +x` and FUSE 2. When FUSE is unavailable, set `APPIMAGE_EXTRACT_AND_RUN=1`. A compatible graphical session and WebKitGTK runtime are required.\n<!-- cy-kaf-client-release-notice:end -->'
          expected=(
            "Cy-KafClient_${RELEASE_VERSION}_macos-x86_64.dmg"
            "Cy-KafClient_${RELEASE_VERSION}_macos-aarch64.dmg"
            "Cy-KafClient_${RELEASE_VERSION}_windows-x86_64-setup.exe"
            "Cy-KafClient_${RELEASE_VERSION}_windows-aarch64-setup.exe"
            "Cy-KafClient_${RELEASE_VERSION}_linux-x86_64.AppImage"
            "Cy-KafClient_${RELEASE_VERSION}_linux-aarch64.AppImage"
            "SHA256SUMS.txt"
          )
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              keep=false
              for expected_asset in "${expected[@]}"; do
                if [ "${asset}" = "${expected_asset}" ]; then
                  keep=true
                  break
                fi
              done
              if [ "${keep}" = false ]; then
                gh release delete-asset "${RELEASE_TAG}" "${asset}" --yes
              fi
            done < <(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')
            existing_body="$(gh release view "${RELEASE_TAG}" --json body --jq '.body')"
            if [[ "${existing_body}" == *"${notice_end}"* ]]; then
              generated_notes="${existing_body#*"${notice_end}"}"
            else
              generated_notes="${existing_body}"
            fi
            while [[ "${generated_notes}" == $'\n'* || "${generated_notes}" == $'\r'* ]]; do
              generated_notes="${generated_notes:1}"
            done
            body="${notice}"
            if [ -n "${generated_notes}" ]; then
              body="${body}"$'\n\n'"${generated_notes}"
            fi
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "Cy-KafClient ${RELEASE_TAG}" \
              --notes "${body}" \
              --draft=false \
              --prerelease=false
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --verify-tag \
              --title "Cy-KafClient ${RELEASE_TAG}" \
              --generate-notes \
              --notes "${notice}"
          fi
          actual="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort)"
          wanted="$(printf '%s\n' "${expected[@]}" | sort)"
          if [ "${actual}" != "${wanted}" ]; then
            echo "published release assets do not match expected set" >&2
            diff <(printf '%s\n' "${wanted}") <(printf '%s\n' "${actual}") || true
            exit 1
          fi
          release_state="$(gh release view "${RELEASE_TAG}" \
            --json isDraft,isPrerelease \
            --jq '[.isDraft, .isPrerelease] | @tsv')"
          if [ "${release_state}" != $'false\tfalse' ]; then
            echo "release is not a public final release: ${release_state}" >&2
            exit 1
          fi

# 说明：CI 的 build-matrix 用空 webui/static 出"无前端"工件做编译门禁；
# 含前端的完整产物由 desktop-package 在原生 runner 上构建。
# integration 与 e2e（make test-integration / make e2e-p1a）需本机 Docker/colima，
# 刻意不进 CI；desktop-package 只用空 Kafka 配置验证六个平台/架构组合的原生包与进程生命周期，
# 不启动或查询 Kafka。
