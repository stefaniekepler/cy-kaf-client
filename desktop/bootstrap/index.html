<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Cy KafClient</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main>
      <section id="starting" class="panel" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p class="eyebrow">DESKTOP CLIENT</p>
        <h1>Cy KafClient</h1>
        <p class="message">正在启动本地服务…</p>
      </section>

      <section id="failed" class="panel" aria-live="assertive" hidden>
        <div class="failure-mark" aria-hidden="true">!</div>
        <p class="eyebrow">STARTUP FAILED</p>
        <h1>客户端启动失败</h1>
        <p id="error-message" class="message">请重试或查看日志。</p>
        <div class="actions">
          <button type="button" data-action="retry">重试</button>
          <button type="button" data-action="reassign-port">重新分配端口</button>
          <button type="button" data-action="open-logs">打开日志目录</button>
          <button type="button" class="secondary" data-action="quit">退出</button>
        </div>
      </section>
    </main>
  </body>
</html>
